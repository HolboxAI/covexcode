name: Build Matrix

# Reusable: called both by release.yml (which turns these artifacts into a
# published release) and pr-build-check.yml (which just wants to know
# whether every target still compiles, and throws the artifacts away).
# Kept in one place so the two callers can never drift apart on which
# platforms are actually supported -- see release.yml's own note on why
# there is no Intel-macOS entry.
on:
  workflow_call:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            suffix: ""
          # x86_64 builds natively, so its glibc floor is the runner's. Pin
          # ubuntu-22.04 (glibc 2.35) rather than the floating `ubuntu-latest`
          # (glibc 2.39 today, heading to 2.43): glibc is backward- but not
          # forward-compatible, so a binary built on `ubuntu-latest` refuses to
          # start on any distro with an older glibc ("GLIBC_x.yy not found").
          # aarch64 is built with `cross` below, so its glibc comes from the
          # cross Docker image rather than this runner.
          #
          # The -musl entries are what the IDE bundles: they are statically
          # linked and do not depend on the user's glibc or OpenSSL version.
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            suffix: -musl
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            suffix: -musl
          - os: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: cargo install cross

      - name: Install musl tools (for Linux x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (native)
        if: matrix.os != 'linux' || matrix.arch != 'aarch64'
        run: |
          cargo build --release --target ${{ matrix.target }} --bin covexcode
          cargo build --release --target ${{ matrix.target }} --no-default-features --bin covexcode-agent

      - name: Build (cross)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: |
          cross build --release --target ${{ matrix.target }} --bin covexcode
          cross build --release --target ${{ matrix.target }} --no-default-features --bin covexcode-agent

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          asset="covexcode-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/covexcode" "artifacts/${asset}"
          chmod +x "artifacts/${asset}"
          agent_asset="covexcode-agent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/covexcode-agent" "artifacts/${agent_asset}"
          chmod +x "artifacts/${agent_asset}"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy target\${{ matrix.target }}\release\covexcode.exe artifacts\covexcode-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}.exe
          copy target\${{ matrix.target }}\release\covexcode-agent.exe artifacts\covexcode-agent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: covexcode-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}
          path: artifacts/
