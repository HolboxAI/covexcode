name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      # Tests share process-global state by design: HOME, COVEXCODE_CONFIG_DIR
      # and the config/token files under them. `with_isolated_home` serializes
      # the tests that opt in, but a parallel test that no longer touches the
      # config can still see whichever HOME is currently installed -- that is
      # what produced the intermittent `mine()` (0 vs 3 projects) and
      # pre-tools-config (gpt-3.5-turbo vs deepseek-chat) failures on CI.
      # Running the binaries one test at a time removes the interleaving.
      - name: Run tests
        run: cargo test --all -- --test-threads=1

      - name: Run clippy (linter)
        run: cargo clippy --all --all-targets

      - name: Test install script
        run: bash tests/install_script_test.sh

      - name: Test install.ps1
        # ubuntu-24.04 ships pwsh preinstalled, so this genuinely runs the
        # PowerShell installer's real functions on every CI run, not just on
        # a real Windows machine.
        run: pwsh -NoProfile -File tests/install_ps1_test.ps1
