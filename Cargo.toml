[package]
name = "covexcode"
version = "1.11.94"
edition = "2021"
# Two binaries exist (src/main.rs + src/bin/mcp-fake-server.rs); without this,
# a bare `cargo run` fails with "could not determine which binary to run".
default-run = "covexcode"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ratatui = "0.26"
crossterm = "0.27"
reqwest = { version = "0.11", features = ["stream", "json"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
glob = "0.3"
regex = "1"
sha2 = "0.11.0"
rand = "0.8"
arboard = "3"
png = "0.17"
image = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true

# Forces reqwest's transitive OpenSSL (native-tls) to build vendored/statically
# from source rather than link the system's, but *only* when compiling for
# this one target -- release.yml's linux-aarch64 job runs inside a `cross`
# container with no aarch64 openssl.pc for pkg-config to find, so plain
# openssl-sys fails to cross-compile there. Every other target (this dev
# machine included) keeps linking the system's OpenSSL exactly as before:
# vendoring it everywhere would also demand a working Perl (Time::Piece,
# missing here) and, on Windows, NASM -- trading one broken target for a
# chance at breaking others that already work.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
