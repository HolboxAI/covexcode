[package]
name = "covexcode"
version = "1.11.94"
edition = "2021"
# Two binaries exist (src/main.rs + src/bin/mcp-fake-server.rs); without this,
# a bare `cargo run` fails with "could not determine which binary to run".
default-run = "covexcode"

[features]
default = ["cli"]
cli = ["dep:ratatui", "dep:crossterm"]

[[bin]]
name = "covexcode"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "covexcode-agent"
path = "src/bin/covexcode-agent.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
glob = "0.3"
regex = "1"
sha2 = "0.11.0"
rand = "0.8"
arboard = "3"
png = "0.17"
image = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true

# Forces reqwest's transitive OpenSSL (native-tls) to build vendored/statically
# from source rather than link the system's, but *only* when compiling for
# this one target -- release.yml's linux-aarch64 job runs inside a `cross`
# container with no aarch64 openssl.pc for pkg-config to find, so plain
# openssl-sys fails to cross-compile there. Every other target (this dev
# machine included) keeps linking the system's OpenSSL exactly as before:
# vendoring it everywhere would also demand a working Perl (Time::Piece,
# missing here) and, on Windows, NASM -- trading one broken target for a
# chance at breaking others that already work.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64", target_env = "gnu"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

# The IDE sidecar ships musl builds so it runs on older Linux distributions
# without a glibc/OpenSSL match. Use rustls there: it keeps the sidecar
# statically linked and avoids an OpenSSL cross-build (which needs Perl and a
# target musl toolchain in the `cross` image). Every other target keeps the
# existing native-tls behavior unchanged.
[target.'cfg(target_env = "musl")'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["stream", "json", "rustls-tls"] }

[target.'cfg(not(target_env = "musl"))'.dependencies]
reqwest = { version = "0.11", features = ["stream", "json"] }
